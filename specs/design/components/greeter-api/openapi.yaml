openapi: 3.0.3
info:
  title: Greeter API
  version: 0.1.0
  description: Returns a hello greeting, optionally personalized by name.
servers:
  - url: /
paths:
  /greeting:
    get:
      operationId: getGreeting
      summary: Get a hello greeting, optionally personalized
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Optional name to personalize the greeting with
      responses:
        '200':
          description: The greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Greeting:
      type: object
      required: [message]
      properties:
        name:
          type: string
          nullable: true
          description: The name supplied by the caller, if any
        message:
          type: string
          description: The greeting text, e.g. "Hello, World!"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: HTTP or application error code
        message:
          type: string
          description: short human-readable label
        description:
          type: string
          description: detailed explanation
        moreInfo:
          type: string
          description: URI to documentation
